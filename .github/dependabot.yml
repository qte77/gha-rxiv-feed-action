---
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Reason: init, analyze and autobuild are one action release; separate PRs drift apart.
      codeql-action:
        patterns:
          - "github/codeql-action*"
...
