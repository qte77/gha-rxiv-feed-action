---
name: Publish Release

# Manual fallback: publish the GitHub Release for an existing tag when the
# automatic publish in `tag-release.yaml` did not run or failed. Never
# overwrites an existing release (qte77/.github#23).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank for latest v* tag)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@a32769a925e4d056b5d389ad727f7831973f7161  # main 2026-11-12 (qte77/.github#64)
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
...
