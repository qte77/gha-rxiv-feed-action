---
name: Publish Release

# Manual fallback: publish the GitHub Release for an existing tag when the
# automatic publish in `tag-release.yaml` did not run or failed. Never
# overwrites an existing release (qte77/.github#23).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank for latest v* tag)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@b4674e37a8baa90102b4dd11c86c08a1e6335278  # v0.1.1
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: write
...
