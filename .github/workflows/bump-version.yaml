---
name: Bump version

# Step 1 of 2 of the release pipeline (see docs: README "Versioning").
# Bumps version files on a branch and opens a `chore(release)` PR.
# Tagging + the GitHub Release are handled by `tag-release.yaml`, which
# fires when this PR is merged to `main` (so the tag lands on the merge
# commit, not a throwaway bump-branch commit). No floating major tag.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  BRANCH_NEW: "bump-${{ github.run_number }}-${{ github.ref_name }}"

jobs:
  bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Bump version (files only, no commit/tag)
        id: bump
        uses: callowayproject/bump-my-version@169cce310a3bf9a723d4810157635401de72a07a # 1.4
        with:
          args: ${{ inputs.bump_type }}

      - name: Commit, push branch, open PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ env.BRANCH_NEW }}
          BASE: ${{ github.ref_name }}
          VERSION: ${{ steps.bump.outputs.current-version }}
          PREV_VERSION: ${{ steps.bump.outputs.previous-version }}
        run: |
          git config user.name "bump-my-version"
          git config user.email "bump-my-version@qte77.gha"
          git checkout -b "$BRANCH"
          git commit -am "chore(release): bump $PREV_VERSION -> $VERSION"
          # The bump-my-version Docker action disrupts the persisted git
          # credential, so push to an explicitly token-authenticated URL.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "chore(release): bump $PREV_VERSION -> $VERSION" \
            --body "Automated version bump \`v$PREV_VERSION\` -> \`v$VERSION\`. Merging this PR triggers \`tag-release.yaml\`, which tags \`v$VERSION\` on the \`$BASE\` merge commit and publishes the GitHub Release."
