---
name: Bump version

# Step 1 of 2 of the release pipeline (see README "Versioning").
# Thin caller of the qte77/.github reusable: bumps version files with
# bump-my-version, makes a signed commit via the API on a bump branch, and
# opens a `chore(release)` PR. Tagging + the GitHub Release are handled by
# `tag-release.yaml` when that PR is merged to `main`.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    with:
      bump_type: ${{ inputs.bump_type }}
    permissions:
      contents: write
      pull-requests: write
...
