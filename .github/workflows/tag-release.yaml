---
name: Tag and Release

# Step 2 of 2 of the release pipeline (see docs/usage.md "Versioning").
# Fires when a version bump (from `bump-version.yaml`) is merged to main:
# tags the merge commit `vX.Y.Z` and publishes the GitHub Release from the
# matching CHANGELOG section, via the qte77/.github reusables. Both
# reusables abort rather than overwrite an existing tag or release, and
# never delete tags (tag immutability, qte77/.github#23).
#
# NOTE: a push made by GITHUB_TOKEN does not re-trigger workflows, so the
# bump PR must be merged with user/PAT credentials for this to fire.

on:
  push:
    branches: [main]
    paths: ['pyproject.toml']

permissions:
  contents: write

jobs:
  # The reusable tag workflow outputs only the tag it created, so detect the
  # bump here first: it gates both the tag and publish jobs and gives the
  # version (and skips non-version pyproject.toml edits).
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect version change
        id: detect
        run: |
          new=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          old=$(git show HEAD^:pyproject.toml | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')
          if [ "$new" = "$old" ]; then
            echo "no version change ($old == $new); nothing to tag"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "version $old -> $new"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$new" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    uses: qte77/.github/.github/workflows/tag-release.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    permissions:
      contents: write

  publish:
    needs: [detect, tag]
    if: needs.detect.outputs.bumped == 'true'
    uses: qte77/.github/.github/workflows/publish-release.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    with:
      tag: v${{ needs.detect.outputs.version }}
    permissions:
      contents: write
...
