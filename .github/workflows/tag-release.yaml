---
name: Tag and Release

# Step 2 of 2 of the release pipeline (see README "Versioning").
# Fires when a version bump (from `bump-version.yaml`) is merged to main:
# tags the merge commit `vX.Y.Z` and publishes the GitHub Release from the
# matching CHANGELOG section, via the qte77/.github reusables. Both
# reusables abort rather than overwrite an existing tag or release, and
# never delete tags (tag immutability, qte77/.github#23).
#
# NOTE: a push made by GITHUB_TOKEN does not re-trigger workflows, so the
# bump PR must be merged with user/PAT credentials for this to fire.

on:
  push:
    branches: [main]
    paths: ['pyproject.toml']

permissions:
  contents: write

jobs:
  # The reusable tag workflow exposes no outputs, so detect the bump here to
  # gate and parameterize the publish step (and skip it on non-version
  # pyproject.toml edits).
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect version change
        id: detect
        run: |
          new=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          old=$(git show HEAD^:pyproject.toml | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')
          if [ "$new" = "$old" ]; then
            echo "no version change ($old == $new); nothing to tag"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "version $old -> $new"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$new" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    uses: qte77/.github/.github/workflows/tag-release.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    permissions:
      contents: write

  publish:
    needs: [detect, tag]
    if: needs.detect.outputs.bumped == 'true'
    uses: qte77/.github/.github/workflows/publish-release.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    with:
      tag: v${{ needs.detect.outputs.version }}
    permissions:
      contents: write
...
