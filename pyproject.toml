[project]
name = "gha-rxiv-feed-action"
version = "0.2.4"
description = "Log a weekly CSV feed of papers submitted to arXiv, bioRxiv, or medRxiv for selected categories."
authors = [
    {name = "qte77", email = "qte@77.gh"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0.12", "requests>=2.32"]

[dependency-groups]
dev = ["complexipy>=4.0", "pytest>=9.0.3", "ruff>=0.15.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "N",    # PEP-8 naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs)
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PT",   # pytest style
    "ANN",  # flake8-annotations (type hints)
    "TCH",  # flake8-type-checking (move imports to TYPE_CHECKING)
    "PGH",  # pygrep-hooks (no broad noqa, etc.)
    "C90",  # mccabe cyclomatic complexity
    "D",    # pydocstyle (docstring style)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is pytest's idiom
    "D",       # tests are self-documenting via their names
    "ANN",     # tests don't require full annotation coverage
    "PT009",   # unittest-style assertEqual etc. — file mixes unittest + pytest
    "PT011",   # pytest.raises without `match` is fine for our use
    "PT027",   # unittest-style assertRaises
]

[tool.complexipy]
max-complexity-allowed = 10
quiet = false

[tool.bumpversion]
current_version = "0.2.4"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = true
ignore_missing_version = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} -> {new_version}"
message = "Bump version: {current_version} -> {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "[![Version](https://img.shields.io/badge/version-{current_version}-blue.svg)](CHANGELOG.md)"
replace = "[![Version](https://img.shields.io/badge/version-{new_version}-blue.svg)](CHANGELOG.md)"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = """
## [Unreleased]
"""
replace = """
## [Unreleased]

---

## [{new_version}] - {now:%Y-%m-%d}
"""
